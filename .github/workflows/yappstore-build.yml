name: yappstore-build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "fdroidclient/**"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: install gradle
        run: |
          # 用 gradle wrapper 的依赖(gradle-wrapper.jar), 但直接调系统 gradle 避免 wrapper 权限问题
          cd fdroidclient
          # gradlew 用当前 gradle 环境(系统装的 9.x 与 wrapper 版本接近即可)
          chmod +x ./gradlew 2>/dev/null || true
      - name: build
        run: |
          cd fdroidclient
          # 优先用 wrapper; 若 wrapper 拉不到 gradle 分布, 退回系统 gradle
          if ./gradlew :app:assembleBasicDebug --no-daemon 2>&1 | tail -n 80; then
            echo "WRAPPER_OK"
          else
            echo "wrapper failed, fallback to system gradle"
            # runner 自带 gradle
            gradle :app:assembleBasicDebug --no-daemon 2>&1 | tail -n 80
          fi
          echo "--- APK outputs ---"
          find app/build/outputs/apk -name '*.apk' 2>/dev/null
      - name: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: yappstore-apk
          path: fdroidclient/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
